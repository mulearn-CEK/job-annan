name: Daily Technopark Job Scrape

on:
  schedule:
    # Runs at 3:00 AM UTC daily = 8:30 AM IST. Adjust the cron if you want a different time.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run all scrapers
        run: python main.py

      - name: Sync to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python notion_sync.py
